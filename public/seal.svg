<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Presidential style crest">
  <!-- Outer gold ring -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e08a"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#g)"/>
  <circle cx="128" cy="128" r="110" fill="#0f1b36" stroke="#ffffff22" stroke-width="2"/>

  <!-- Stars ring (13) -->
  <g fill="#fff">
    <g transform="translate(128 128)">
      <g id="s">
        <path d="M0-90l4.5 13.8h14.5l-11.7 8.5 4.5 13.8L0-68.5l-11.8 8.6 4.5-13.8-11.7-8.5h14.5z" transform="scale(0.35)"/>
      </g>
      <g id="sr">
        <use href="#s" transform="rotate(0) translate(0 -92)"/>
        <use href="#s" transform="rotate(27.7) translate(0 -92)"/>
        <use href="#s" transform="rotate(55.4) translate(0 -92)"/>
        <use href="#s" transform="rotate(83.1) translate(0 -92)"/>
        <use href="#s" transform="rotate(110.8) translate(0 -92)"/>
        <use href="#s" transform="rotate(138.5) translate(0 -92)"/>
        <use href="#s" transform="rotate(166.2) translate(0 -92)"/>
        <use href="#s" transform="rotate(193.9) translate(0 -92)"/>
        <use href="#s" transform="rotate(221.6) translate(0 -92)"/>
        <use href="#s" transform="rotate(249.3) translate(0 -92)"/>
        <use href="#s" transform="rotate(277) translate(0 -92)"/>
        <use href="#s" transform="rotate(304.7) translate(0 -92)"/>
        <use href="#s" transform="rotate(332.4) translate(0 -92)"/>
      </g>
    </g>
  </g>

  <!-- Center shield -->
  <g transform="translate(128 128)">
    <path d="M-50 -20h100v38c0 28-22 50-50 50s-50-22-50-50z" fill="#0a1224" stroke="#f6e08a" stroke-width="3"/>
    <rect x="-50" y="-20" width="100" height="26" fill="#b91c1c"/>
    <g fill="#fff">
      <rect x="-50" y="6" width="100" height="6"/>
      <rect x="-50" y="18" width="100" height="6"/>
      <rect x="-50" y="30" width="100" height="6"/>
    </g>
    <!-- Small stars arc above shield -->
    <g fill="#fff" transform="translate(0 -30)">
      <circle r="2.2" cx="-24" cy="-8"/>
      <circle r="2.2" cx="-12" cy="-12"/>
      <circle r="2.2" cx="0" cy="-13.5"/>
      <circle r="2.2" cx="12" cy="-12"/>
      <circle r="2.2" cx="24" cy="-8"/>
    </g>
  </g>
</svg>


